graphhopper:
  datareader.file: ./data/sportforum-60km.osm.pbf
  graph.location: ./graph-cache
  import.osm.ignored_highways: ""
  graph.encoded_values: road_class,surface,road_environment,max_speed,average_slope,bike_access,urban_density
  # Ohne explizites threads>=1 stuerzt der Import ab (ForkJoinPool mit parallelism=0 wirft
  # IllegalArgumentException) - GraphHopper hat hierfuer keinen brauchbaren Default.
  graph.urban_density.threads: 4
  graph.elevation.provider: srtm
  graph.elevation.cache_dir: ./elevation-cache
  graph.elevation.dataaccess: MMAP

  profiles:
    - name: bike
      custom_model:
        priority:
          - if: "road_class == MOTORWAY"
            multiply_by: "0"
          # highway=track (Feld-/Waldwege) komplett ausschliessen - unsere eigene
          # Korridor-Extraktion (HighwayTags.RoadHighwayTypes) haelt sie ohnehin nie fuer
          # geeignet, und sie tragen fast nie ein surface-Tag (die Untergrund-Abwertung unten
          # greift dann nicht, "missing" wird bewusst nicht als unbefestigt gewertet, siehe
          # CONCEPT.md Abschnitt 6.16).
          - if: "road_class == TRACK"
            multiply_by: "0"
          # OSM bicycle=no/access=no (und motorroad=yes) - ohne diese Regel routet GraphHopper
          # klaglos ueber Strassen, auf denen Radfahren gar nicht erlaubt ist, z.B. Abschnitte
          # der B1 oestlich von Berlin (highway=primary, bicycle=no - road_class allein reicht
          # hier nicht, siehe CONCEPT.md Abschnitt 6.10).
          - if: "!bike_access"
            multiply_by: "0"
          # Staedtische Ballungsgebiete abwerten, nicht ausschliessen - der Startpunkt (Sportforum
          # Berlin) liegt selbst in einem Stadtrandgebiet, ein hartes Verbot koennte die
          # Routenerstellung in dichteren Startlagen unmoeglich machen. Siehe CONCEPT.md
          # Abschnitt 6.11.
          - if: "urban_density == CITY"
            multiply_by: "0.5"
          # Rauen/unbefestigten Untergrund abwerten, nicht ausschliessen - macht bereits den
          # ersten round_trip-Versuch deutlich wahrscheinlicher konform mit den
          # Untergrund-Limits aus 6.9, statt rein auf zufaellig guenstige Seeds zu hoffen. Siehe
          # CONCEPT.md Abschnitt 6.12. "missing"/PAVED/ASPHALT/CONCRETE/PAVING_STONES bewusst
          # nicht abgewertet - siehe SurfaceClassifier.IsUnpaved (Domain) fuer dieselbe
          # Denyliste-Begruendung.
          - if: "surface == UNPAVED || surface == COMPACTED || surface == FINE_GRAVEL || surface == GRAVEL || surface == GROUND || surface == DIRT || surface == GRASS || surface == SAND || surface == COBBLESTONE"
            multiply_by: "0.5"
        speed:
          - if: "true"
            limit_to: "25"

server:
  application_connectors:
    - type: http
      port: 8989
  admin_connectors:
    - type: http
      port: 8990
