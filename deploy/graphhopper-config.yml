graphhopper:
  datareader.file: ./data/sportforum-60km.osm.pbf
  graph.location: ./graph-cache
  import.osm.ignored_highways: ""
  graph.encoded_values: road_class,surface,smoothness,road_environment,max_speed,average_slope,bike_access,urban_density,racingbike_access,racingbike_average_speed,racingbike_priority,bike_network,mtb_rating,hike_rating,bike_road_access
  # Ohne explizites threads>=1 stuerzt der Import ab (ForkJoinPool mit parallelism=0 wirft
  # IllegalArgumentException) - GraphHopper hat hierfuer keinen brauchbaren Default.
  # Bewusst auf 1 gesetzt (abweichend von phase0-spike/graphhopper/config.yml, dort bleibt 4) -
  # Render's "standard"-Plan hat nur 1 vCPU, mehr Threads als Kerne bringt bei dieser CPU-
  # gebundenen Berechnung keine echte Parallelitaet, nur Kontextwechsel-Overhead.
  graph.urban_density.threads: 1
  graph.elevation.provider: srtm
  graph.elevation.cache_dir: ./elevation-cache
  graph.elevation.dataaccess: MMAP

  profiles:
    - name: bike
      custom_model:
        priority:
          # GraphHoppers eigenes, vorgefertigtes "racingbike"-Template als Fundament (siehe
          # CONCEPT.md Abschnitt 6.17) - racingbike_priority ist ein von GraphHopper selbst aus
          # Strassentyp/Oberflaeche/etc. berechneter Gesamt-Eignungswert pro Weg,
          # racingbike_access/mtb_rating/hike_rating/bike_road_access decken Zugangs- und
          # Technik-Einschraenkungen ab, die wir bisher nicht kannten. Wortgleich uebernommen
          # aus core/src/main/resources/com/graphhopper/custom_models/racingbike.json, NUR ohne
          # dessen speed-Regeln (siehe unten).
          - if: "true"
            multiply_by: "racingbike_priority"
          - if: "bike_network == INTERNATIONAL || bike_network == NATIONAL"
            multiply_by: "1.2"
          - else_if: "bike_network == REGIONAL || bike_network == LOCAL"
            multiply_by: "1.1"
          - if: "road_environment == FERRY"
            multiply_by: "0.5"
          - if: "mtb_rating > 2"
            multiply_by: "0"
          - else_if: "mtb_rating == 2"
            multiply_by: "0.5"
          - if: "hike_rating > 1"
            multiply_by: "0"
          - if: "bike_road_access == NO"
            multiply_by: "0"
          - if: "!racingbike_access && (!backward_racingbike_access || roundabout)"
            multiply_by: "0"
          - else_if: "!racingbike_access && backward_racingbike_access"
            multiply_by: "0.2"
          # --- Eigene Ergaenzungen obendrauf (redundant zum Template ist hier bewusst in Kauf
          # genommen - schadet nicht, schuetzt aber falls das Template einen Fall doch nicht
          # abdeckt, siehe CONCEPT.md 6.17) ---
          - if: "road_class == MOTORWAY"
            multiply_by: "0"
          # highway=track (Feld-/Waldwege) komplett ausschliessen - unsere eigene
          # Korridor-Extraktion (HighwayTags.RoadHighwayTypes) haelt sie ohnehin nie fuer
          # geeignet, und sie tragen fast nie ein surface-Tag (die Untergrund-Abwertung unten
          # greift dann nicht, "missing" wird bewusst nicht als unbefestigt gewertet, siehe
          # CONCEPT.md Abschnitt 6.16).
          - if: "road_class == TRACK"
            multiply_by: "0"
          # OSM bicycle=no/access=no (und motorroad=yes) - ohne diese Regel routet GraphHopper
          # klaglos ueber Strassen, auf denen Radfahren gar nicht erlaubt ist, z.B. Abschnitte
          # der B1 oestlich von Berlin (highway=primary, bicycle=no - road_class allein reicht
          # hier nicht, siehe CONCEPT.md Abschnitt 6.10).
          - if: "!bike_access"
            multiply_by: "0"
          # Staedtische Ballungsgebiete abwerten, nicht ausschliessen - der Startpunkt (Sportforum
          # Berlin) liegt selbst in einem Stadtrandgebiet, ein hartes Verbot koennte die
          # Routenerstellung in dichteren Startlagen unmoeglich machen. Siehe CONCEPT.md
          # Abschnitt 6.11.
          - if: "urban_density == CITY"
            multiply_by: "0.5"
          # Rauen/unbefestigten Untergrund abwerten, nicht ausschliessen - macht bereits den
          # ersten round_trip-Versuch deutlich wahrscheinlicher konform mit den
          # Untergrund-Limits aus 6.9, statt rein auf zufaellig guenstige Seeds zu hoffen. Siehe
          # CONCEPT.md Abschnitt 6.12. "missing"/PAVED/ASPHALT/CONCRETE/PAVING_STONES bewusst
          # nicht abgewertet - siehe SurfaceClassifier.IsUnpaved (Domain) fuer dieselbe
          # Denyliste-Begruendung.
          - if: "surface == UNPAVED || surface == COMPACTED || surface == FINE_GRAVEL || surface == GRAVEL || surface == GROUND || surface == DIRT || surface == GRASS || surface == SAND || surface == COBBLESTONE"
            multiply_by: "0.5"
          # Wie die Untergrund-Abwertung oben, aber ueber "smoothness" statt "surface" - faengt
          # rissigen/holprigen Belag ab, der (noch) gar kein schlechtes surface-Tag traegt (z.B.
          # alter Asphalt). Ueberschneidet sich mit surface=sett/cobblestone (die haben fast immer
          # auch smoothness=bad) - GraphHopper multipliziert alle zutreffenden priority-Regeln
          # miteinander, ein Weg mit BEIDEN Merkmalen wird also 0.5*0.5=0.25 statt nur 0.5
          # abgewertet. Bewusst in Kauf genommen (ein doppelt schlechter Weg SOLL staerker
          # abgewertet werden), siehe CONCEPT.md Abschnitt 6.19 und
          # SurfaceClassifier.IsBadSmoothness (Domain).
          - if: "smoothness == BAD || smoothness == VERY_BAD || smoothness == HORRIBLE || smoothness == VERY_HORRIBLE || smoothness == IMPASSABLE"
            multiply_by: "0.5"
        speed:
          # Bewusst NICHT racingbike_average_speed uebernommen. Urspruenglich, weil unsere eigene
          # Zeitschaetzung GraphHoppers "time" direkt uebernahm - seit CONCEPT.md 6.24 nutzt
          # RouteConstructionService.EstimateTotalTime ausschliesslich PowerSpeedModel und ignoriert
          # GraphHoppers "time" komplett, der Grund entfaellt also. Bleibt trotzdem bei einem festen
          # Wert: die Streckenauswahl/Korridorsuche soll nicht von einem variablen, roadClass-
          # abhaengigen Geschwindigkeitsmodell verzerrt werden.
          - if: "true"
            limit_to: "25"

server:
  # NUR intern erreichbar (siehe CONCEPT.md 6.26/deploy/graphhopper/HealthProxy.java) - der
  # extern exponierte Port 8989 gehoert jetzt dem HealthProxy, der sofort antwortet, waehrend
  # GraphHopper noch importiert, und erst danach auf diesen Port durchreicht. Lokal (phase0-spike)
  # bleibt es bei 8989, dort gibt es das Render-Deploy-Timeout-Problem nicht.
  application_connectors:
    - type: http
      port: 18989
  admin_connectors:
    - type: http
      port: 8990
