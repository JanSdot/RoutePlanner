graphhopper:
  datareader.file: ../data/sportforum-60km.osm.pbf
  graph.location: ./graph-cache
  import.osm.ignored_highways: ""
  graph.encoded_values: road_class,surface,smoothness,road_environment,max_speed,average_slope,bike_access,urban_density,racingbike_access,racingbike_average_speed,racingbike_priority,bike_network,mtb_rating,hike_rating,bike_road_access
  # Ohne explizites threads>=1 stuerzt der Import ab (ForkJoinPool mit parallelism=0 wirft
  # IllegalArgumentException) - GraphHopper hat hierfuer keinen brauchbaren Default.
  graph.urban_density.threads: 4
  graph.elevation.provider: srtm
  graph.elevation.cache_dir: ./elevation-cache
  graph.elevation.dataaccess: MMAP

  profiles:
    - name: bike
      custom_model:
        priority:
          # GraphHoppers eigenes "racingbike"-Template als Fundament, siehe
          # deploy/graphhopper-config.yml und CONCEPT.md Abschnitt 6.17.
          - if: "true"
            multiply_by: "racingbike_priority"
          - if: "bike_network == INTERNATIONAL || bike_network == NATIONAL"
            multiply_by: "1.2"
          - else_if: "bike_network == REGIONAL || bike_network == LOCAL"
            multiply_by: "1.1"
          - if: "road_environment == FERRY"
            multiply_by: "0.5"
          - if: "mtb_rating > 2"
            multiply_by: "0"
          - else_if: "mtb_rating == 2"
            multiply_by: "0.5"
          - if: "hike_rating > 1"
            multiply_by: "0"
          - if: "bike_road_access == NO"
            multiply_by: "0"
          - if: "!racingbike_access && (!backward_racingbike_access || roundabout)"
            multiply_by: "0"
          - else_if: "!racingbike_access && backward_racingbike_access"
            multiply_by: "0.2"
          # --- Eigene Ergaenzungen obendrauf ---
          - if: "road_class == MOTORWAY"
            multiply_by: "0"
          # highway=track - siehe deploy/graphhopper-config.yml und CONCEPT.md Abschnitt 6.16.
          - if: "road_class == TRACK"
            multiply_by: "0"
          # OSM bicycle=no/access=no - siehe deploy/graphhopper-config.yml und CONCEPT.md
          # Abschnitt 6.10.
          - if: "!bike_access"
            multiply_by: "0"
          # Staedtische Ballungsgebiete abwerten - siehe CONCEPT.md Abschnitt 6.11.
          - if: "urban_density == CITY"
            multiply_by: "0.5"
          # Rauen/unbefestigten Untergrund abwerten - siehe CONCEPT.md Abschnitt 6.12.
          - if: "surface == UNPAVED || surface == COMPACTED || surface == FINE_GRAVEL || surface == GRAVEL || surface == GROUND || surface == DIRT || surface == GRASS || surface == SAND || surface == COBBLESTONE"
            multiply_by: "0.5"
          # smoothness=bad/... wie unbefestigt behandeln - siehe deploy/graphhopper-config.yml
          # und CONCEPT.md Abschnitt 6.19.
          - if: "smoothness == BAD || smoothness == VERY_BAD || smoothness == HORRIBLE || smoothness == VERY_HORRIBLE || smoothness == IMPASSABLE"
            multiply_by: "0.5"
        speed:
          # Bewusst NICHT racingbike_average_speed - siehe deploy/graphhopper-config.yml fuer
          # die Begruendung (eigene physikbasierte Zeitschaetzung, PowerSpeedModel).
          - if: "true"
            limit_to: "25"

server:
  application_connectors:
    - type: http
      port: 8989
  admin_connectors:
    - type: http
      port: 8990
