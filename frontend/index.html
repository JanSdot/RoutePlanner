<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <title>WattLoop</title>
    <!-- Loest die im Produktions-Build von Rolldown ausgeschlossene "maplibre-gl"-Importe
         (siehe build.rollupOptions.external in vite.config.ts) zur unveraenderten Vendor-Kopie
         auf (frontend/scripts/copy-maplibre-assets.mjs). Im Dev-Server ungenutzt, da Vite dort
         bare Importe selbst zu expliziten URLs auf node_modules aufloest. Muss vor dem
         Modul-Script stehen. -->
    <script type="importmap">
      { "imports": { "maplibre-gl": "/vendor/maplibre-gl/maplibre-gl.mjs" } }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
